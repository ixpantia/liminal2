name: normative
title: Normative consensus
description: Anchored elicitation of normative agreement around the target.
items:
  threshold_owner:
    label: Threshold ownership
    anchors:
      0: No owner
      0.25: Unclear owner
      0.5: Single team owner
      0.75: Cross-functional owner
      1: Accountable owner with delegated authority
  cost_ratio_agreed:
    label: Cost ratio agreement
    anchors:
      0: No agreement on costs
      0.25: Costs are discussed informally
      0.5: One side has agreed
      0.75: All major parties agree
      1: Cost ratio is jointly agreed and recorded
  stakeholder_agreement:
    label: Stakeholder agreement
    anchors:
      0: Stakeholders disagree
      0.25: Limited agreement
      0.5: Majority agreement
      0.75: Broad agreement
      1: All relevant stakeholders agree
  regulatory_constraint:
    label: Regulatory constraint
    anchors:
      0: No regulatory constraint
      0.25: Weak guidance
      0.5: Binding internal policy
      0.75: Binding external guidance
      1: Hard regulatory constraint
  reversibility:
    label: Reversibility
    anchors:
      0: Irreversible
      0.25: Reversible with major cost
      0.5: Reversible with moderate cost
      0.75: Reversible with minor cost
      1: Easily reversible
  precedent:
    label: Precedent
    anchors:
      0: No precedent
      0.25: Isolated precedent
      0.5: Some precedent
      0.75: Strong precedent
      1: Settled precedent
weights:
  threshold_owner: 0.1666666667
  cost_ratio_agreed: 0.1666666667
  stakeholder_agreement: 0.1666666667
  regulatory_constraint: 0.1666666667
  reversibility: 0.1666666667
  precedent: 0.1666666667
